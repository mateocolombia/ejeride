<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>EjeRide · Admin WhatsApp</title><link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet"><style>
:root{--deep:#10191d;--sand:#c99863;--paper:#f4efe8;--ink:#21343b;--muted:#748187;--green:#2fbf78;--orange:#e6a348;--line:rgba(33,52,59,.14);--blue:#3478c4}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}a{color:inherit;text-decoration:none}.hide{display:none!important}main{width:min(980px,calc(100vw - 24px));margin:18px auto 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h1{margin:0;font-family:Georgia,serif;font-size:34px;font-weight:500}h1 span{color:var(--sand)}.muted{color:var(--muted);font-size:11px;line-height:1.5}.panel{background:#fff;border-radius:22px;padding:17px;margin:12px 0;box-shadow:0 18px 50px rgba(16,25,29,.05)}h2{margin:0 0 12px;font-size:15px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:800;font-size:11px;cursor:pointer}.dark{background:var(--deep);color:#fff;border-color:var(--deep)}.green{background:var(--green);color:#fff;border-color:var(--green)}.orange{background:var(--orange);color:#fff;border-color:var(--orange)}input{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px}.login{display:grid;grid-template-columns:1fr auto;gap:8px}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.mapwrap{height:480px;border-radius:18px;overflow:hidden;border:1px solid var(--line);position:relative}.map{position:absolute;inset:0}.empty{position:absolute;inset:0;display:grid;place-items:center;padding:25px;text-align:center;color:var(--muted);z-index:2;pointer-events:none}.client-pin{width:34px;height:34px;border-radius:50% 50% 50% 0;background:var(--sand);transform:rotate(-45deg);border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.25)}.list{display:grid;gap:8px;max-height:480px;overflow:auto}.item{width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:15px;background:#fff;cursor:pointer}.item.active{border-color:var(--sand);box-shadow:0 0 0 2px rgba(201,152,99,.12)}.item strong{display:block;font-size:13px}.item small{display:block;margin-top:4px;color:var(--muted)}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#edf4ef;color:#2d7251;font-size:9px;font-weight:800;margin-top:6px}.badge.wait{background:#fff3e3;color:#9a641f}.detail{margin-top:12px;padding:13px;border-radius:15px;background:#f8f6f2}.detail strong{display:block;font-size:14px}.detail p{margin:5px 0;color:var(--muted);font-size:11px}.maps{display:none;margin-top:10px}.maps.show{display:flex;gap:8px;flex-wrap:wrap}.maps a{min-height:44px;padding:0 14px;border-radius:999px;background:#eef8ff;color:#246c8d;display:inline-flex;align-items:center;font-size:11px;font-weight:800}.maps button{min-height:44px}.status-actions{display:flex;gap:8px;flex-wrap:wrap}.choice.active{box-shadow:0 0 0 3px rgba(16,25,29,.08)}.new-wa{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}@media(max-width:760px){.layout{grid-template-columns:1fr}.mapwrap{height:360px}.list{max-height:330px}.top{flex-direction:column;align-items:flex-start}.login{grid-template-columns:1fr}}
</style></head><body><main><div class="top"><div><h1>Eje<span>Ride</span></h1><div class="muted">Admin · positions reçues via WhatsApp</div></div><a class="muted" href="/">Site public ↗</a></div><section class="panel" data-login><h2>Accès</h2><div class="login"><input id="pin" type="password" placeholder="PIN"><button class="btn dark" data-open>Ouvrir</button></div><p class="muted" data-login-msg></p></section><div class="hide" data-dash><section class="panel"><h2>Disponibilité</h2><div class="status-actions"><button class="btn choice" data-state="available">🟢 Disponible</button><button class="btn choice" data-state="busy">🟠 Occupé</button><button class="btn choice" data-state="offline">⚫ Indisponible</button><input id="minutes" type="number" min="1" max="360" value="30" style="width:92px"><button class="btn dark" data-save>Mettre à jour</button></div><div class="new-wa"><button class="btn green" data-new>Créer un message localisation WhatsApp</button><span class="muted" data-new-msg></span></div></section><div class="layout"><section class="panel"><h2>Carte client</h2><div class="mapwrap"><div id="map" class="map"></div><div class="empty" data-map-empty>En attente d’une localisation WhatsApp.</div></div><div class="detail hide" data-detail><strong data-name></strong><p data-code></p><p data-address></p><div class="maps" data-actions><a data-google target="_blank" rel="noopener">Ouvrir dans Google Maps</a><button class="btn" data-done>Terminer</button></div></div></section><section class="panel"><h2>Clients WhatsApp</h2><div class="list" data-list><div class="muted">Aucune position reçue.</div></div></section></div></div></main><script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script><script>
(()=>{let pin='',state='available',sessions=[],selected=null,map,marker,cfg={mapStyle:'https://tiles.openfreemap.org/styles/liberty'};const $=s=>document.querySelector(s);const headers=()=>({'Content-Type':'application/json','x-ejeride-pin':pin});async function api(url,o={}){const r=await fetch(url,{...o,headers:{...(o.headers||{}),...headers()},cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erreur');return d}async function login(){pin=$('#pin').value.trim();try{await api('/.netlify/functions/wa-session?admin=1');sessionStorage.setItem('ejeridePin',pin);$('[data-dash]').classList.remove('hide');$('[data-login-msg]').textContent='Accès OK ✓';await loadStatus();await refresh()}catch{$('[data-login-msg]').textContent='PIN incorrect'}}$('[data-open]').onclick=login;$('#pin').value=sessionStorage.getItem('ejeridePin')||'';if($('#pin').value)login();document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;document.querySelectorAll('[data-state]').forEach(x=>x.classList.toggle('active',x===b))});async function loadStatus(){try{const s=await fetch('/.netlify/functions/status',{cache:'no-store'}).then(r=>r.json());state=s.status||'offline';document.querySelectorAll('[data-state]').forEach(x=>x.classList.toggle('active',x.dataset.state===state))}catch{}}$('[data-save]').onclick=async()=>{await fetch('/.netlify/functions/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin,status:state,minutes:Number($('#minutes').value||30)})})};async function initCfg(){try{const r=await fetch('/.netlify/functions/config');if(r.ok)cfg={...cfg,...await r.json()}}catch{}}function initMap(){if(map)return;map=new maplibregl.Map({container:'map',style:cfg.mapStyle,center:[-75.6811,4.5339],zoom:12.5});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right')}function pinEl(){const e=document.createElement('div');e.className='client-pin';return e}function show(s){selected=s;document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x.dataset.token===s.token));initMap();const loc=s.location;if(loc){$('[data-map-empty]').classList.add('hide');if(!marker)marker=new maplibregl.Marker({element:pinEl(),anchor:'bottom'}).setLngLat([loc.lng,loc.lat]).addTo(map);else marker.setLngLat([loc.lng,loc.lat]);map.easeTo({center:[loc.lng,loc.lat],zoom:16});$('[data-detail]').classList.remove('hide');$('[data-name]').textContent=s.customerName||s.waId||'Client WhatsApp';$('[data-code]').textContent=`${s.code} · ${s.waId||''}`;$('[data-address]').textContent=loc.name||loc.address||`${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}`;$('[data-actions]').classList.add('show');$('[data-google]').href=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(loc.lat+','+loc.lng)}&travelmode=driving&dir_action=navigate`}else{$('[data-map-empty]').classList.remove('hide');$('[data-detail]').classList.remove('hide');$('[data-name]').textContent=s.customerName||s.waId||'Client WhatsApp';$('[data-code]').textContent=s.code;$('[data-address]').textContent='En attente de la localisation WhatsApp.';$('[data-actions]').classList.remove('show')}}function render(){const l=$('[data-list]');if(!sessions.length){l.innerHTML='<div class="muted">Aucune position reçue.</div>';return}l.innerHTML=sessions.map(s=>`<button class="item ${selected?.token===s.token?'active':''}" data-token="${s.token}"><strong>${escapeHtml(s.customerName||s.waId||'Client WhatsApp')}</strong><small>${escapeHtml(s.code)} · ${new Date(s.updatedAt||s.createdAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</small><span class="badge ${s.location?'':'wait'}">${s.location?'📍 Position reçue':'En attente'}</span></button>`).join('');l.querySelectorAll('.item').forEach(b=>b.onclick=()=>show(sessions.find(s=>s.token===b.dataset.token)))}function escapeHtml(x){return String(x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function refresh(){try{const d=await api('/.netlify/functions/wa-session?admin=1');sessions=(d.sessions||[]).filter(s=>s.status!=='completed');render();if(selected){const n=sessions.find(s=>s.token===selected.token);if(n)show(n)}else{const n=sessions.find(s=>s.location)||sessions[0];if(n)show(n)}}catch{}}$('[data-new]').onclick=async()=>{const msg=$('[data-new-msg]');msg.textContent=' Création…';try{const d=await api('/.netlify/functions/wa-session',{method:'POST',body:JSON.stringify({action:'create',admin:true,lang:'es'})});msg.textContent=' Ouverture de WhatsApp…';location.href=d.whatsappUrl}catch(e){msg.textContent=' Erreur'}};$('[data-done]').onclick=async()=>{if(!selected)return;await api('/.netlify/functions/wa-session',{method:'POST',body:JSON.stringify({action:'complete',token:selected.token})});selected=null;if(marker){marker.remove();marker=null}$('[data-detail]').classList.add('hide');$('[data-map-empty]').classList.remove('hide');await refresh()};initCfg().then(initMap);setInterval(refresh,4000)})();
</script></body></html>
