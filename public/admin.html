<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>EjeRide · Admin</title><link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet"><style>
:root{--deep:#10191d;--sand:#c99863;--paper:#f4efe8;--ink:#21343b;--muted:#748187;--green:#2fbf78;--orange:#e6a348;--red:#dc6a63;--line:rgba(33,52,59,.14);--blue:#3c6f8b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}a{color:inherit;text-decoration:none}main{width:min(820px,calc(100vw - 26px));margin:18px auto 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1{margin:0;font-family:Georgia,serif;font-size:34px;font-weight:500}h1 span{color:var(--sand)}.muted{color:var(--muted);font-size:11px;line-height:1.5}.panel{background:#fff;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 18px 50px rgba(16,25,29,.06)}h2{margin:0 0 11px;font-size:16px}.hide{display:none!important}label{display:grid;gap:5px;font-size:10px;font-weight:700}input{min-height:45px;border:1px solid var(--line);border-radius:12px;padding:0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.btn{min-height:45px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:0 14px;font-weight:700;cursor:pointer}.dark{background:var(--deep);color:#fff;border-color:var(--deep)}.green{background:var(--green);color:#fff;border-color:var(--green)}.orange{background:var(--orange);color:#fff;border-color:var(--orange)}.red{background:var(--red);color:#fff;border-color:var(--red)}.blue{background:var(--blue);color:#fff;border-color:var(--blue)}.choice.active{box-shadow:0 0 0 3px rgba(16,25,29,.08)}.statusmsg{font-size:11px;color:var(--muted)}.linkbox{padding:14px;border-radius:15px;background:#f7f5f1;border:1px solid var(--line)}.link{word-break:break-all;font-size:11px;color:#345e76;margin:6px 0 10px}.big{width:100%;min-height:56px}.mapbox{height:330px;border-radius:18px;overflow:hidden;margin-top:12px;border:1px solid var(--line);position:relative}.map{position:absolute;inset:0}.gpsline{padding:11px;border-radius:12px;background:#edf4ef;font-size:11px;margin-top:9px}.client-dot{width:24px;height:24px;border-radius:50%;background:#3579d3;border:5px solid #fff;box-shadow:0 0 0 2px rgba(53,121,211,.25)}.navrow{display:none;margin-top:10px}.navrow.show{display:block}.navrow a{min-height:45px;border:1px solid #d7e3ea;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;background:#eef8ff;color:#246c8d}.car{width:44px;height:44px}.car svg{width:100%;height:100%}.testbox{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}.testbox summary{cursor:pointer;color:var(--muted);font-size:11px;font-weight:700}.testbox .row{margin-top:8px}@media(max-width:620px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.btn{flex:1 1 auto}.panel{padding:15px}.mapbox{height:290px}}
</style></head><body><main><div class="top"><div><h1>Eje<span>Ride</span></h1><div class="muted">Admin chauffeur · suivi live</div></div><a class="muted" href="/">Site public ↗</a></div><section class="panel" data-login-panel><h2>Accès</h2><div class="grid"><label>PIN<input id="pin" type="password"></label><div style="display:flex;align-items:end"><button class="btn dark" data-login>Ouvrir</button></div></div><p class="statusmsg" data-login-msg></p></section><div data-dashboard class="hide"><section class="panel"><h2>Disponibilité</h2><div class="row"><button class="btn choice" data-state="available">🟢 Disponible</button><button class="btn choice" data-state="busy">🟠 Occupé</button><button class="btn choice" data-state="offline">⚫ Indisponible</button></div><div class="row" style="margin-top:10px"><label>Libre dans<input id="busyMinutes" type="number" min="1" max="360" value="30"></label><button class="btn dark" data-save-status>Mettre à jour</button></div><p class="statusmsg" data-status-msg></p></section><section class="panel"><h2>Nouveau client</h2><button class="btn dark big" data-create>Créer un lien client</button><div class="linkbox hide" data-linkbox style="margin-top:12px"><div class="link" data-link></div><div class="row"><button class="btn green" data-wa>Envoyer sur WhatsApp</button><button class="btn" data-copy>Copier le lien</button></div></div></section><section class="panel"><h2>Suivi actif</h2><div data-no-trip class="muted">Aucun suivi actif.</div><div data-trip class="hide"><div class="row"><button class="btn green" data-gps-toggle>Démarrer mon GPS</button><button class="btn orange" data-arrived>Je suis arrivé</button><button class="btn red" data-complete>Terminer</button></div><div class="gpsline" data-gps>GPS arrêté.</div><div class="mapbox"><div id="adminMap" class="map"></div></div><div class="navrow" data-client-nav><a data-client-google target="_blank" rel="noopener">Ouvrir le client dans Google Maps</a></div><p class="muted" data-client>Client : position en attente.</p><details class="testbox"><summary>Mode test (France)</summary><div class="row"><button class="btn" data-test>Test Armenia</button><button class="btn" data-test-move>Avancer la voiture</button></div></details></div></section></div></main><script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script><script>
(()=>{let pin='',state='available',trip=null,watch=null,lastSent=0,map,driverM,clientM,testI=0;const $=s=>document.querySelector(s),headers=()=>({'Content-Type':'application/json','x-ejeride-pin':pin});async function api(u,o={}){const r=await fetch(u,{...o,headers:{...(o.headers||{}),...headers()}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erreur');return d}function link(t){return `${location.origin}/track.html?t=${encodeURIComponent(t)}`}
async function login(){pin=$('#pin').value.trim();try{await api('/.netlify/functions/trip?admin=1');sessionStorage.setItem('ejeridePin',pin);$('[data-dashboard]').classList.remove('hide');$('[data-login-msg]').textContent='Accès OK ✓';await loadStatus();await loadTrip()}catch(e){$('[data-login-msg]').textContent='PIN incorrect'}}$('[data-login]').onclick=login;$('#pin').value=sessionStorage.getItem('ejeridePin')||'';if($('#pin').value)login();document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;document.querySelectorAll('[data-state]').forEach(x=>x.classList.toggle('active',x===b))});async function loadStatus(){try{const s=await fetch('/.netlify/functions/status',{cache:'no-store'}).then(r=>r.json());state=s.status||'offline';document.querySelectorAll('[data-state]').forEach(x=>x.classList.toggle('active',x.dataset.state===state))}catch(e){}}$('[data-save-status]').onclick=async()=>{await fetch('/.netlify/functions/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin,status:state,minutes:Number($('#busyMinutes').value||30)})});$('[data-status-msg]').textContent='Mis à jour ✓'};
$('[data-create]').onclick=async()=>{try{const d=await api('/.netlify/functions/trip',{method:'POST',body:JSON.stringify({action:'create'})});setTrip(d.trip,true)}catch(e){alert(e.message)}};function setTrip(t,newLink=false){trip=t;$('[data-no-trip]').classList.add('hide');$('[data-trip]').classList.remove('hide');if(newLink){$('[data-linkbox]').classList.remove('hide');$('[data-link]').textContent=link(t.token)}renderMap();updateClientNav();$('[data-client]').textContent=t.pickupLat?'Client : position reçue ✓':'Client : position en attente.'}
$('[data-wa]').onclick=()=>trip&&(location.href=`https://wa.me/?text=${encodeURIComponent('EjeRide · ouvre ce lien et partage ton point : '+link(trip.token))}`);async function copy(){if(!trip)return;try{await navigator.clipboard.writeText(link(trip.token));alert('Copié')}catch(e){prompt('Copier',link(trip.token))}}$('[data-copy]').onclick=copy;async function loadTrip(){try{const d=await api('/.netlify/functions/trip?admin=1');const t=(d.trips||[]).find(x=>!['completed','cancelled'].includes(x.status));if(t)setTrip(t)}catch(e){}}
function updateClientNav(){const box=$('[data-client-nav]');if(!box)return;const lat=Number(trip?.pickupLat),lng=Number(trip?.pickupLng);const ok=Number.isFinite(lat)&&Number.isFinite(lng);box.classList.toggle('show',ok);if(!ok)return;const c=`${lat},${lng}`;$('[data-client-google]').href=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(c)}&travelmode=driving&dir_action=navigate`}
function initMap(){if(map)return;map=new maplibregl.Map({container:'adminMap',style:'https://tiles.openfreemap.org/styles/liberty',center:[-75.6811,4.5339],zoom:12.5});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right')}function carEl(){const e=document.createElement('div');e.className='car';e.innerHTML='<svg viewBox="0 0 64 64"><path d="M22 11c2-5 6-7 10-7s8 2 10 7l5 12v22c0 5-4 9-9 9H26c-5 0-9-4-9-9V23l5-12Z" fill="#fff" stroke="#1c3138" stroke-width="2"/><path d="M24 17c2-4 5-6 8-6s6 2 8 6l3 7H21l3-7Z" fill="#8fa3ad"/><path d="M21 30h22" stroke="#c99863" stroke-width="2"/></svg>';return e}function clientEl(){const e=document.createElement('div');e.className='client-dot';return e}function renderMap(){initMap();if(!trip)return;if(trip.driverLat){if(!driverM)driverM=new maplibregl.Marker({element:carEl()}).setLngLat([trip.driverLng,trip.driverLat]).addTo(map);else driverM.setLngLat([trip.driverLng,trip.driverLat])}if(trip.pickupLat){if(!clientM)clientM=new maplibregl.Marker({element:clientEl()}).setLngLat([trip.pickupLng,trip.pickupLat]).addTo(map);else clientM.setLngLat([trip.pickupLng,trip.pickupLat])}const p=[];if(trip.driverLat)p.push([trip.driverLng,trip.driverLat]);if(trip.pickupLat)p.push([trip.pickupLng,trip.pickupLat]);if(p.length===2){const b=new maplibregl.LngLatBounds(p[0],p[0]);b.extend(p[1]);map.fitBounds(b,{padding:60,maxZoom:16,duration:500})}else if(p.length===1)map.easeTo({center:p[0],zoom:15})}
async function send(lat,lng,accuracy=5,heading=null){if(!trip)return;await api('/.netlify/functions/trip',{method:'POST',body:JSON.stringify({action:'location',token:trip.token,lat,lng,accuracy,heading})});trip.driverLat=lat;trip.driverLng=lng;trip.driverHeading=heading;renderMap()}function stopGPS(){if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;$('[data-gps]').textContent='GPS arrêté.';$('[data-gps-toggle]').textContent='Démarrer mon GPS';$('[data-gps-toggle]').classList.add('green')}function startGPS(){if(!navigator.geolocation){$('[data-gps]').textContent='GPS non disponible';return}$('[data-gps-toggle]').textContent='Arrêter mon GPS';$('[data-gps]').textContent='GPS actif…';watch=navigator.geolocation.watchPosition(async p=>{if(Date.now()-lastSent<4000)return;lastSent=Date.now();try{await send(p.coords.latitude,p.coords.longitude,p.coords.accuracy,p.coords.heading);$('[data-gps]').textContent='GPS actif · ±'+Math.round(p.coords.accuracy||0)+' m'}catch(e){}},()=>{$('[data-gps]').textContent='Localisation refusée ou indisponible.';stopGPS()},{enableHighAccuracy:true,maximumAge:1000,timeout:15000})}$('[data-gps-toggle]').onclick=()=>watch===null?startGPS():stopGPS();async function st(x){if(!trip)return;const d=await api('/.netlify/functions/trip',{method:'POST',body:JSON.stringify({action:'status',token:trip.token,status:x})});setTrip(d.trip);if(x==='completed')stopGPS()}$('[data-arrived]').onclick=()=>st('arrived');$('[data-complete]').onclick=()=>st('completed');const tests=[[-75.6811,4.5339],[-75.6785,4.5350],[-75.6760,4.5365],[-75.6732,4.5380]];$('[data-test]').onclick=async()=>{testI=0;await send(tests[0][1],tests[0][0],5,70);$('[data-gps]').textContent='Mode test Armenia actif.'};$('[data-test-move]').onclick=async()=>{testI=(testI+1)%tests.length;await send(tests[testI][1],tests[testI][0],5,70);$('[data-gps]').textContent='Voiture test déplacée.'};setInterval(async()=>{if(!trip)return;try{const d=await api('/.netlify/functions/trip?admin=1');const t=(d.trips||[]).find(x=>x.token===trip.token);if(t)setTrip(t)}catch(e){}},5000)})();
</script></body></html>
