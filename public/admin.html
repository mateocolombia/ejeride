<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>EjeRide · Disponibilité</title>
<style>
:root{--deep:#10191d;--sand:#c99863;--paper:#f4efe8;--ink:#21343b;--muted:#748187;--line:rgba(33,52,59,.14)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,a{font:inherit}a{text-decoration:none;color:inherit}.hide{display:none!important}
main{width:min(620px,calc(100vw - 24px));margin:20px auto 60px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
h1{margin:0;font-family:Georgia,serif;font-size:35px;font-weight:500}h1 span{color:var(--sand)}h2{margin:0 0 13px;font-size:17px}
.muted{color:var(--muted);font-size:12px;line-height:1.5}.panel{background:#fff;border-radius:24px;padding:19px;margin:12px 0;box-shadow:0 18px 50px rgba(16,25,29,.05)}
.login{display:grid;grid-template-columns:1fr auto;gap:8px}input{min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:14px}
.btn{min-height:48px;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:800;font-size:12px;cursor:pointer}
.dark{background:var(--deep);color:#fff;border-color:var(--deep)}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice.active{box-shadow:0 0 0 3px rgba(16,25,29,.11)}
.save{display:flex;gap:8px;margin-top:11px}.save input{width:96px}.save .btn{flex:1}.feedback{min-height:18px;margin:11px 0 0;color:var(--muted);font-size:12px}
@media(max-width:560px){.status{grid-template-columns:1fr 1fr}.status .choice:last-child{grid-column:1/-1}.login{grid-template-columns:1fr}.save{display:grid;grid-template-columns:90px 1fr}}
</style>
</head>
<body>
<main>
  <div class="top"><div><h1>Eje<span>Ride</span></h1><div class="muted">Gestion de la disponibilité</div></div><a class="muted" href="/">Site public ↗</a></div>
  <section class="panel" data-login>
    <h2>Accès privé</h2>
    <div class="login"><input id="pin" type="password" placeholder="PIN"><button class="btn dark" data-open>Ouvrir</button></div>
    <p class="feedback" data-login-msg></p>
  </section>
  <section class="panel hide" data-dash>
    <h2>Mon statut</h2>
    <div class="status">
      <button class="btn choice" data-state="available">🟢 Disponible</button>
      <button class="btn choice" data-state="busy">🟠 Occupé</button>
      <button class="btn choice" data-state="offline">⚫ Indisponible</button>
    </div>
    <div class="save"><input id="minutes" type="number" min="1" max="360" value="30" aria-label="Libre dans X minutes"><button class="btn dark" data-save>Mettre à jour</button></div>
    <p class="feedback" data-feedback></p>
  </section>
</main>
<script>
(()=>{
let pin='',state='offline';const $=s=>document.querySelector(s);
async function status(){const r=await fetch('/.netlify/functions/status',{cache:'no-store'});return r.json()}
async function login(){pin=$('#pin').value.trim();try{const s=await status();sessionStorage.setItem('ejeridePin',pin);$('[data-dash]').classList.remove('hide');$('[data-login-msg]').textContent='Accès ouvert ✓';state=s.status||'offline';document.querySelectorAll('[data-state]').forEach(x=>x.classList.toggle('active',x.dataset.state===state))}catch{$('[data-login-msg]').textContent='Impossible de charger le statut.'}}
$('[data-open]').onclick=login;$('#pin').value=sessionStorage.getItem('ejeridePin')||'';if($('#pin').value)login();
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;document.querySelectorAll('[data-state]').forEach(x=>x.classList.toggle('active',x===b))});
$('[data-save]').onclick=async()=>{const f=$('[data-feedback]');f.textContent='Mise à jour…';const r=await fetch('/.netlify/functions/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin,status:state,minutes:Number($('#minutes').value||30)})});const d=await r.json().catch(()=>({}));f.textContent=r.ok?'Statut mis à jour ✓':(d.error||'Erreur')};
})();
</script>
</body>
</html>
