<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#10191d"><title>EjeRide · Seguimiento</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--deep:#10191d;--sand:#c99863;--paper:#f5f0e9;--ink:#21343b;--muted:#748187;--green:#42c985}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{padding:15px 18px;background:var(--deep);color:#fff;display:flex;justify-content:space-between;align-items:center}.brand{font-family:Georgia,serif;font-size:27px}.brand span{color:var(--sand)}.langs button{border:0;background:transparent;color:#fff;opacity:.58;padding:7px;cursor:pointer}.langs button.active{opacity:1}.wrap{width:min(900px,100%);margin:auto}.summary{padding:24px 18px 18px}.summary h1{margin:0;font-family:Georgia,serif;font-size:37px;line-height:1}.summary p{margin:10px 0 0;color:var(--muted);font-size:13px}.eta{display:flex;gap:18px;align-items:end;margin-top:18px}.eta strong{font-family:Georgia,serif;font-size:52px;line-height:.8}.eta span{color:var(--muted);font-size:12px}.map{height:min(54svh,500px);min-height:350px;background:#dfe5e5}.actions{display:flex;gap:9px;flex-wrap:wrap;padding:16px 18px 24px}.btn{min-height:46px;border:1px solid rgba(33,52,59,.14);border-radius:999px;background:#fff;padding:0 16px;color:var(--ink);font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.main{background:var(--deep);color:#fff;border-color:var(--deep)}.privacy{padding:0 18px 24px;color:var(--muted);font-size:10px}.car-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sand);color:#fff;border:3px solid #fff;box-shadow:0 5px 15px rgba(0,0,0,.25);font-size:17px}.pickup-icon{width:20px;height:20px;border-radius:50%;background:var(--green);border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.18)}.done{display:none;padding:18px;border-radius:18px;background:#fff;margin:0 18px 18px}.done.show{display:block}@media(max-width:520px){.map{height:50svh}.summary h1{font-size:33px}.eta strong{font-size:46px}.actions .btn{flex:1}}</style></head><body><div class="top"><div class="brand">Eje<span>Ride</span></div><div class="langs"><button class="active" data-lang="es">ES</button><button data-lang="en">EN</button><button data-lang="fr">FR</button></div></div><main class="wrap"><section class="summary"><h1 data-title>Preparando el seguimiento…</h1><p data-sub>Este enlace es privado.</p><div class="eta" data-eta-box style="display:none"><strong data-eta>—</strong><span data-eta-label>min aprox.<br><b data-distance></b></span></div></section><div id="map" class="map"></div><div class="done" data-done><strong data-done-title>Trayecto finalizado.</strong><p data-done-text>Gracias por confiar en EjeRide.</p></div><div class="actions"><button class="btn" data-share>Compartir seguimiento</button><a class="btn main" data-whatsapp href="#">WhatsApp</a><a class="btn" data-review href="#" style="display:none">Dejar una reseña</a><a class="btn" data-rebook href="#" style="display:none">Reservar de nuevo</a></div><p class="privacy" data-privacy>La posición se muestra únicamente durante la llegada del conductor. No compartas este enlace públicamente.</p></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>(()=>{const token=new URLSearchParams(location.search).get('t');let lang='es',trip=null,map,driverMarker,pickupMarker,routeLine,lastRoute=0,config={whatsapp:'573001234567'};const c={es:{enroute:'Tu conductor está en camino',arrived:'Tu conductor ha llegado',complete:'Trayecto finalizado',waiting:'Esperando la ubicación del conductor…',private:'Este enlace es privado.',min:'min aprox.',share:'Compartir seguimiento',review:'Dejar una reseña',rebook:'Reservar de nuevo',done:'Trayecto finalizado.',thanks:'Gracias por confiar en EjeRide.',privacy:'La posición se muestra únicamente durante la llegada del conductor. No compartas este enlace públicamente.',wa:'Hola, estoy siguiendo mi llegada con EjeRide.',again:'Hola, quiero solicitar otro trayecto con EjeRide.'},en:{enroute:'Your driver is on the way',arrived:'Your driver has arrived',complete:'Journey completed',waiting:'Waiting for driver location…',private:'This link is private.',min:'min approx.',share:'Share tracking',review:'Leave a review',rebook:'Book again',done:'Journey completed.',thanks:'Thank you for choosing EjeRide.',privacy:'The position is shown only while the driver is arriving. Do not share this link publicly.',wa:'Hello, I am following my EjeRide arrival.',again:'Hello, I would like to request another EjeRide journey.'},fr:{enroute:'Votre chauffeur est en route',arrived:'Votre chauffeur est arrivé',complete:'Trajet terminé',waiting:'En attente de la position du chauffeur…',private:'Ce lien est privé.',min:'min env.',share:'Partager le suivi',review:'Laisser un avis',rebook:'Réserver à nouveau',done:'Trajet terminé.',thanks:'Merci d’avoir choisi EjeRide.',privacy:'La position est affichée uniquement pendant l’arrivée du chauffeur. Ne partagez pas ce lien publiquement.',wa:'Bonjour, je suis l’arrivée de mon chauffeur EjeRide.',again:'Bonjour, je souhaite demander un nouveau trajet EjeRide.'}};const t=k=>c[lang][k]||k;async function loadConfig(){try{const r=await fetch('/.netlify/functions/config');if(r.ok)config={...config,...await r.json()}}catch(e){}}function initMap(){map=L.map('map',{zoomControl:true}).setView([4.5339,-75.6811],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map)}function divIcon(cls,html,size){return L.divIcon({className:'',html:`<div class="${cls}">${html||''}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]})}function setMarker(which,lat,lng){if(!lat||!lng)return;if(which==='driver'){if(!driverMarker)driverMarker=L.marker([lat,lng],{icon:divIcon('car-icon','↗',34)}).addTo(map);else driverMarker.setLatLng([lat,lng])}else{if(!pickupMarker)pickupMarker=L.marker([lat,lng],{icon:divIcon('pickup-icon','',20)}).addTo(map);else pickupMarker.setLatLng([lat,lng])}}async function loadTrip(){if(!token)return fail();try{const r=await fetch('/.netlify/functions/trip?token='+encodeURIComponent(token),{cache:'no-store'});if(!r.ok)throw 0;trip=await r.json();render();if(Date.now()-lastRoute>25000&&trip.status==='en_route'&&trip.driverLat&&trip.pickupLat){lastRoute=Date.now();loadRoute()}}catch(e){fail()}}function fail(){document.querySelector('[data-title]').textContent='Lien de suivi indisponible';document.querySelector('[data-sub]').textContent=''}function render(){const title=document.querySelector('[data-title]'),sub=document.querySelector('[data-sub]'),etaBox=document.querySelector('[data-eta-box]');if(trip.status==='completed'){title.textContent=t('complete');sub.textContent=t('private');document.querySelector('[data-done]').classList.add('show');document.querySelector('[data-done-title]').textContent=t('done');document.querySelector('[data-done-text]').textContent=t('thanks');etaBox.style.display='none';document.querySelector('[data-review]').style.display=config.googleReviewUrl?'inline-flex':'none';document.querySelector('[data-rebook]').style.display='inline-flex'}else if(trip.status==='arrived'){title.textContent=t('arrived');sub.textContent=trip.pickupLabel||t('private');etaBox.style.display='flex';document.querySelector('[data-eta]').textContent='0'}else{title.textContent=t('enroute');sub.textContent=trip.pickupLabel||t('private');if(trip.driverLat&&trip.pickupLat)etaBox.style.display='flex';else{etaBox.style.display='none';sub.textContent=t('waiting')}}if(trip.driverLat&&trip.status!=='completed')setMarker('driver',trip.driverLat,trip.driverLng);if(trip.pickupLat)setMarker('pickup',trip.pickupLat,trip.pickupLng);if(trip.driverLat&&trip.pickupLat&&map){const b=L.latLngBounds([[trip.driverLat,trip.driverLng],[trip.pickupLat,trip.pickupLng]]);map.fitBounds(b.pad(.35),{maxZoom:16})}updateActions()}async function loadRoute(){try{const r=await fetch('/.netlify/functions/route?token='+encodeURIComponent(token),{cache:'no-store'});if(!r.ok)return;const d=await r.json();document.querySelector('[data-eta]').textContent=Math.max(1,Math.round(d.duration/60));document.querySelector('[data-distance]').textContent=d.distance?`${(d.distance/1000).toFixed(1)} km`:'';document.querySelector('[data-eta-label]').innerHTML=`${t('min')}<br><b>${d.distance?(d.distance/1000).toFixed(1)+' km':''}</b>`;if(d.geometry&&map){const pts=d.geometry.coordinates.map(x=>[x[1],x[0]]);if(routeLine)routeLine.setLatLngs(pts);else routeLine=L.polyline(pts,{weight:5,opacity:.72}).addTo(map)}}catch(e){}}function updateActions(){const wa=document.querySelector('[data-whatsapp]'),re=document.querySelector('[data-rebook]'),rv=document.querySelector('[data-review]');wa.href=`https://wa.me/${config.whatsapp||'573001234567'}?text=${encodeURIComponent(t('wa'))}`;wa.target='_blank';re.href=`https://wa.me/${config.whatsapp||'573001234567'}?text=${encodeURIComponent(t('again'))}`;re.target='_blank';if(config.googleReviewUrl){rv.href=config.googleReviewUrl;rv.target='_blank'}document.querySelector('[data-share]').textContent=t('share');rv.textContent=t('review');re.textContent=t('rebook');document.querySelector('[data-privacy]').textContent=t('privacy')}function setLang(x){lang=x;document.documentElement.lang=x;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===x));if(trip)render();else document.querySelector('[data-sub]').textContent=t('private');updateActions()}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));document.querySelector('[data-share]').onclick=async()=>{const data={title:'EjeRide',text:t('share'),url:location.href};if(navigator.share)try{await navigator.share(data)}catch(e){}else{await navigator.clipboard.writeText(location.href);alert('Lien copié')}};initMap();loadConfig().then(()=>{updateActions();loadTrip()});setInterval(loadTrip,6000)})();</script></body></html>
