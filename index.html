    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:-2;
      background:radial-gradient(circle at 73% 33%,rgba(71,69,105,.18),transparent 36%);
      pointer-events:none;
    }

    .header{
      position:absolute;
      z-index:10;
      inset:0 0 auto;
      min-height:78px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:13px max(20px,calc((100vw - 1260px)/2));
      border-bottom:1px solid rgba(255,255,255,.13);
    }
    .brand{display:flex;align-items:center;gap:13px}
    .mark{width:42px;height:42px;flex:0 0 auto}
    .mark svg{width:100%;height:100%;display:block}
    .brand-copy{display:grid;gap:3px}
    .brand-name{font-family:var(--serif);font-size:32px;font-weight:600;line-height:.88;letter-spacing:-.035em}
    .brand-name span{color:var(--sand)}
    .brand-sub{font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.62)}
    .langs{display:flex;align-items:center;gap:6px}
    .langs button{border:0;background:transparent;color:#fff;padding:9px 10px;border-radius:999px;cursor:pointer;font-size:10px;font-weight:700;opacity:.56}
    .langs button.active{background:rgba(255,255,255,.13);opacity:1}

    .hero-inner{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:110px 22px 60px;
    }
    .hero-copy{width:min(920px,100%);text-align:center}
    .eyebrow{margin:0 0 18px;font-size:10px;font-weight:700;letter-spacing:.30em;text-transform:uppercase;color:rgba(255,255,255,.82)}
    h1{margin:0;font-family:var(--serif);font-size:clamp(72px,9vw,128px);font-weight:500;line-height:.80;letter-spacing:-.035em;text-shadow:0 8px 32px rgba(0,0,0,.2)}
    .lead{width:min(670px,100%);margin:28px auto 0;color:rgba(255,255,255,.86);font-size:clamp(15px,1.25vw,18px);line-height:1.7}

    .whatsapp{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:11px;
      min-height:58px;
      margin-top:30px;
      padding:0 27px;
      border-radius:999px;
      background:var(--sand);
      color:#fff;
      font-size:14px;
      font-weight:700;
      box-shadow:0 16px 38px rgba(0,0,0,.16);
      transition:transform .2s ease,background .2s ease;
    }
    .whatsapp:hover{transform:translateY(-2px);background:#b98552}
    .whatsapp svg{width:21px;height:21px;fill:currentColor}

    .float{
      position:fixed;
      z-index:20;
      right:18px;
      bottom:18px;
      width:58px;
      height:58px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:#25D366;
      color:#fff;
      box-shadow:0 16px 36px rgba(0,0,0,.22);
    }
    .float svg{width:28px;height:28px;fill:currentColor}

    @media(max-width:620px){
      .header{padding:11px 13px}.mark{width:35px;height:35px}.brand-name{font-size:27px}.brand-sub{display:none}
      .langs button{padding:7px 7px}
      .hero-inner{padding:100px 15px 48px}
      h1{font-size:clamp(58px,16vw,82px)}
      .lead{font-size:15px}
      .whatsapp{width:min(100%,340px)}
      .float{width:54px;height:54px;right:14px;bottom:14px}
    }
  </style>
</head>
<body>
  <section class="hero" id="inicio">
    <div class="hero-bg" aria-hidden="true"></div>

    <header class="header">
      <a class="brand" href="#inicio" aria-label="EjeRide">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <path d="M14 11h17c7.5 0 12.5 5 12.5 11.7S38.5 35 31 35h-8" stroke="#c79763" stroke-width="4.6" stroke-linecap="round"/>
            <path d="M14 11v41M14 30h16M24 52c6-7 12-12 22-18" stroke="#c79763" stroke-width="4.6" stroke-linecap="round"/>
            <path d="M19 51c8.5-.3 15.5-.2 24.5 1M27 45c4.4 1 8.4 3 12.2 7" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-copy">
          <span class="brand-name">Eje<span>Ride</span></span>
          <span class="brand-sub" data-i18n="brandSub">Movilidad con conductor</span>
        </span>
      </a>

      <div class="langs" aria-label="Idiomas">
        <button class="active" data-lang="es">ES</button>
        <button data-lang="en">EN</button>
        <button data-lang="fr">FR</button>
      </div>
    </header>

    <div class="hero-inner">
      <div class="hero-copy">
        <p class="eyebrow" data-i18n="eyebrow">ARMENIA · QUINDÍO</p>
        <h1 data-i18n="title">Muévete tranquilo.<br>Contacto directo.</h1>
        <p class="lead" data-i18n="lead">Una atención personal, puntual y sencilla. Escríbeme por WhatsApp para información y disponibilidad.</p>
        <a class="whatsapp" data-whatsapp href="#">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M19.1 17.7c-.4-.2-2.2-1.1-2.5-1.2-.3-.1-.6-.2-.8.2-.2.4-.9 1.2-1.1 1.4-.2.2-.4.3-.8.1-2.2-1.1-3.7-2-5.2-4.5-.4-.7.4-.7 1.1-2.2.1-.2 0-.5-.1-.7-.1-.2-.8-2-1.1-2.7-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.7.1-1 .5-1 1.1-1.6 2.4-1.6 3.8 0 2.2 1.6 4.3 1.8 4.6.2.3 3.1 4.8 7.6 6.7 2.8 1.2 3.9 1.3 5.3 1.1.9-.1 2.2-.9 2.5-1.8.3-.9.3-1.7.2-1.8-.1-.2-.4-.3-.8-.5zM16.1 3A12.8 12.8 0 0 0 5.2 22.5L3 30l7.7-2A12.8 12.8 0 1 0 16.1 3zm0 23.3c-1.9 0-3.7-.5-5.3-1.4l-.4-.2-4.6 1.2 1.2-4.5-.3-.5A10.5 10.5 0 1 1 16.1 26.3z"/></svg>
          <span data-i18n="button">Escribir por WhatsApp</span>
        </a>
      </div>
    </div>
  </section>

  <a class="float" data-whatsapp href="#" aria-label="WhatsApp">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M19.1 17.7c-.4-.2-2.2-1.1-2.5-1.2-.3-.1-.6-.2-.8.2-.2.4-.9 1.2-1.1 1.4-.2.2-.4.3-.8.1-2.2-1.1-3.7-2-5.2-4.5-.4-.7.4-.7 1.1-2.2.1-.2 0-.5-.1-.7-.1-.2-.8-2-1.1-2.7-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.7.1-1 .5-1 1.1-1.6 2.4-1.6 3.8 0 2.2 1.6 4.3 1.8 4.6.2.3 3.1 4.8 7.6 6.7 2.8 1.2 3.9 1.3 5.3 1.1.9-.1 2.2-.9 2.5-1.8.3-.9.3-1.7.2-1.8-.1-.2-.4-.3-.8-.5zM16.1 3A12.8 12.8 0 0 0 5.2 22.5L3 30l7.7-2A12.8 12.8 0 1 0 16.1 3zm0 23.3c-1.9 0-3.7-.5-5.3-1.4l-.4-.2-4.6 1.2 1.2-4.5-.3-.5A10.5 10.5 0 1 1 16.1 26.3z"/></svg>
  </a>

  <script>
    (()=>{
      const WHATSAPP='573001234567'; // remplace par ton vrai numéro, sans +
      const copy={
        es:{brandSub:'Movilidad con conductor',eyebrow:'ARMENIA · QUINDÍO',title:'Muévete tranquilo.<br>Contacto directo.',lead:'Una atención personal, puntual y sencilla. Escríbeme por WhatsApp para información y disponibilidad.',button:'Escribir por WhatsApp',message:'Hola, quiero contactar con EjeRide.'},
        en:{brandSub:'Driver mobility',eyebrow:'ARMENIA · QUINDÍO',title:'Travel calmly.<br>Direct contact.',lead:'Personal, punctual and straightforward attention. Message me on WhatsApp for information and availability.',button:'Message on WhatsApp',message:'Hello, I would like to contact EjeRide.'},
        fr:{brandSub:'Mobilité avec chauffeur',eyebrow:'ARMENIA · QUINDÍO',title:'Voyagez sereinement.<br>Contact direct.',lead:'Une attention personnelle, ponctuelle et simple. Écrivez-moi sur WhatsApp pour les informations et disponibilités.',button:'Écrire sur WhatsApp',message:'Bonjour, je souhaite contacter EjeRide.'}
      };
      let current='es';
      function updateLinks(){
        const message=encodeURIComponent(copy[current].message);
        document.querySelectorAll('[data-whatsapp]').forEach(a=>{
          a.href=`https://wa.me/${WHATSAPP}?text=${message}`;
          a.target='_blank';
          a.rel='noopener';
        });
      }
      function setLang(lang){
        current=lang;
        document.documentElement.lang=lang;
        document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
        document.querySelectorAll('[data-i18n]').forEach(el=>{
          const v=copy[lang][el.dataset.i18n];
          if(!v)return;
          v.includes('<br>')?el.innerHTML=v:el.textContent=v;
        });
        updateLinks();
      }
      document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
      updateLinks();
    })();
  </script>
</body>
</html>
